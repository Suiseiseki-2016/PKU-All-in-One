# Minimal CI matrix for the open-source BYOK client.
#
# Runs on Windows, Ubuntu, and macOS:
#   - python -m compileall -q pku_sync
#   - bundle sync check
#   - frontend JS / CSP / zero-external-URL guards
#   - full fake-based pytest suite (uv run pytest, locked deps only)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fake-suite:
    name: compileall + frontend + pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: '3.12'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: compileall typecheck
        run: uv run python -m compileall -q pku_sync

      - name: Verify frontend bundle sync
        run: uv run python -m pku_sync.panel.bundle_frontend --check

      - name: Frontend JS / CSP / external-URL guards
        run: uv run python scripts/check_frontend_js.py

      - name: Fake-based pytest suite
        run: uv run pytest --basetemp=.pytest-basetemp -q
